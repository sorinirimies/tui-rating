[package]
name = "tui-rating"
version = "0.3.0"
edition = "2021"
authors = ["Sorin Irimies <sorinirimies@gmail.com>"]
license = "MIT"
description = "A customizable rating (stars, hearts, ...) widget for ratatui"
repository = "https://github.com/sorinirimies/tui-rating"
readme = "README.md"
keywords = ["tui", "rating", "ratatui", "terminal", "widget"]
categories = ["command-line-interface", "gui", "visualization", "rendering"]
rust-version = "1.88.0"
exclude = [
    ".gitea/**",
    ".github/**",
    ".zed/**",
    "docs/**",
    "examples/vhs/**",
    "scripts/**",
    "cliff.toml",
    "justfile",
    "fuzz/**",
    "deny.toml",
]

[dependencies]
ratatui = { version = "0.30", default-features = false }
tui-nuances = { version = "0.1.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
# Shared theming via tui-nuances (`Rating::theme`, `Themed`, `Theme`).
theme = ["dep:tui-nuances"]
# `RatingState::handle_key` / `handle_mouse` for crossterm events.
crossterm = ["ratatui/crossterm"]
# Serialize / deserialize `RatingState` and the small enums.
serde = ["dep:serde"]

[dev-dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
criterion = { version = "0.5", default-features = false }
proptest = "1"
serde_json = "1"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "interactive"
path = "examples/interactive.rs"
required-features = ["theme"]

[[example]]
name = "half_stars"
path = "examples/half_stars.rs"

[[example]]
name = "symbols"
path = "examples/symbols.rs"

[[example]]
name = "custom"
path = "examples/custom.rs"

[[example]]
name = "alignment"
path = "examples/alignment.rs"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true

[[example]]
name = "styles"
path = "examples/styles.rs"

[[bench]]
name = "render"
harness = false

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[[example]]
name = "mouse"
path = "examples/mouse.rs"
required-features = ["crossterm"]
