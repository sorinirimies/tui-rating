[package]
name = "tui-rating"
version = "0.4.5"
edition = "2024"
authors = ["Sorin Irimies <sorinirimies@gmail.com>"]
license = "MIT"
description = "A customizable rating (stars, hearts, ...) widget for ratatui"
repository = "https://github.com/sorinirimies/tui-rating"
homepage = "https://github.com/sorinirimies/tui-rating"
documentation = "https://docs.rs/tui-rating"
readme = "README.md"
keywords = ["tui", "rating", "ratatui", "terminal", "widget"]
categories = ["command-line-interface", "gui", "visualization", "rendering"]
rust-version = "1.88"
exclude = [
    ".cargo/**",
    ".gitea/**",
    ".github/**",
    ".zed/**",
    "docs/**",
    "examples/vhs/**",
    "scripts/**",
    "cliff.toml",
    "justfile",
    "fuzz/**",
    "deny.toml",
]

[dependencies]
ratatui = { version = "0.30", default-features = false }
tui-nuances = { version = "0.1.11", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["theme"]
# Shared theming via tui-nuances (`Rating::theme`, `Themed`, `Theme`).
theme = ["dep:tui-nuances"]
# `RatingState::handle_key` / `handle_mouse` for crossterm events.
crossterm = ["ratatui/crossterm"]
# Serialize / deserialize `RatingState` and the small enums.
serde = ["dep:serde"]

[dev-dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
criterion = { version = "0.5", default-features = false }
proptest = "1"
serde_json = "1"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "interactive"
path = "examples/interactive.rs"
required-features = ["theme"]

[[example]]
name = "half_stars"
path = "examples/half_stars.rs"

[[example]]
name = "symbols"
path = "examples/symbols.rs"

[[example]]
name = "custom"
path = "examples/custom.rs"

[[example]]
name = "alignment"
path = "examples/alignment.rs"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true

[[example]]
name = "styles"
path = "examples/styles.rs"

[[bench]]
name = "render"
harness = false

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[[example]]
name = "mouse"
path = "examples/mouse.rs"
required-features = ["crossterm"]

[[example]]
name = "survey"
path = "examples/survey.rs"
required-features = ["crossterm"]
