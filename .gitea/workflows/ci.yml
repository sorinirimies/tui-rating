name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

# ensure that the workflow is only triggered once per PR, subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: check formatting
        run: cargo fmt -- --check
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy action
        uses: clechasseur/rs-clippy-check@v4
        with:
          args: --all-features -- -D warnings
      - name: Run clippy (default features)
        run: cargo clippy --locked -- -D warnings
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Check library on MSRV
        run: cargo check --locked --lib
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Run cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
  test:
    runs-on: ubuntu-latest
    name: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # enable this ci template to run regardless of whether the lockfile is checked in or not
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test --locked
        run: cargo test --locked --all-targets
      - name: cargo test --locked --all-features
        run: cargo test --locked --all-features --all-targets
      - name: cargo build (no default features)
        run: cargo build --locked --no-default-features
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  scripts:
    name: nushell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hustcer/setup-nu needs Node >= 20; the runner image ships Node 18,
      # so install the prebuilt binary directly.
      - name: Install Nushell
        run: |
          url=$(curl -fsSL https://api.github.com/repos/nushell/nushell/releases/latest \
            | grep -o 'https://[^"]*x86_64-unknown-linux-gnu.tar.gz' | head -1)
          curl -fsSL "$url" | tar -xz -C /tmp
          sudo cp /tmp/nu-*/nu /usr/local/bin/nu 2>/dev/null || cp /tmp/nu-*/nu /usr/local/bin/nu
          nu --version
      - name: Test scripts
        run: nu scripts/test_scripts.nu
